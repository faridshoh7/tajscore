##
# Tajscore: nginx reverse proxy.
# Отличие от исходного файла ровно одно — в HTTPS-блоке tajscore.duckdns.org
# статика (root + try_files) заменена на proxy_pass к uvicorn на 127.0.0.1:8000.
# Сертификаты, редирект http→https и дефолтный сервер оставлены как были.
##

# Default server configuration
#
server {
	listen 80 default_server;
	listen [::]:80 default_server;

	root /var/www/html;

	# Add index.php to the list if you are using PHP
	index index.html index.htm index.nginx-debian.html;

	server_name _;

	location / {
		# First attempt to serve request as file, then
		# as directory, then fall back to displaying a 404.
		try_files $uri $uri/ =404;
	}
}


server {

    server_name tajscore.duckdns.org; # managed by Certbot

    access_log /var/log/nginx/tajscore.access.log;
    error_log  /var/log/nginx/tajscore.error.log;

    # Логотипы команд приходят с api-sports, сам сайт больших загрузок не принимает
    client_max_body_size 4m;

    # Certbot обновляет сертификат через webroot — отдаём challenge с диска,
    # не пропуская его в приложение
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # keepalive к бэкенду: приложение по WebSocket не работает, Upgrade не пробрасываем
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;

        # Если uvicorn лежит (рестарт по systemd занимает ~5 с) — отдаём 502, а не висим
        proxy_next_upstream error timeout;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/tajscore.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/tajscore.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = tajscore.duckdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


	listen 80 ;
	listen [::]:80 ;
    server_name tajscore.duckdns.org;
    return 404; # managed by Certbot


}
